<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A cut-glass gem seen from the side: table, crown facets and a pavilion point. -->
  <defs>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f6ff"/>
      <stop offset="1" stop-color="#8fc4f2"/>
    </linearGradient>
    <linearGradient id="pavL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fb2ee"/>
      <stop offset="1" stop-color="#4a4fb8"/>
    </linearGradient>
    <linearGradient id="pavR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a86e8"/>
      <stop offset="1" stop-color="#3b3592"/>
    </linearGradient>
  </defs>
  <g stroke="#f4fbff" stroke-width="10" stroke-linejoin="round">
    <!-- crown -->
    <polygon points="112,392 272,200 400,200 336,392" fill="#bfe2fb"/>
    <polygon points="336,392 400,200 624,200 688,392" fill="url(#crown)"/>
    <polygon points="688,392 624,200 752,200 912,392" fill="#a9b8f5"/>
    <!-- pavilion -->
    <polygon points="112,392 336,392 512,888" fill="url(#pavL)"/>
    <polygon points="336,392 688,392 512,888" fill="#6f8fe6"/>
    <polygon points="688,392 912,392 512,888" fill="url(#pavR)"/>
  </g>
  <!-- a glint on the table -->
  <polygon points="436,232 520,232 476,300" fill="#ffffff" opacity="0.85"/>
</svg>
