[package]
name = "refract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Refract: a tray launcher for Claude Code in VS Code."
publish = false

# Built on its own (cross-compiled for Windows), not as part of the root workspace.
[workspace]

[lib]
name = "refract_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
refract-client = { path = "../../crates/refract-client" }
refract-core = { path = "../../crates/refract-core" }
refract-launch = { path = "../../crates/refract-launch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
# Blocking HTTP for GitHub and GitLab, over the system TLS (schannel on Windows).
ureq = { version = "3.4", default-features = false, features = ["native-tls-no-default"] }

# The versions wry uses, to reach WebView2 interfaces Tauri does not wrap.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# CPU and memory for the system widget.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
# PDH for GPU use, ToolHelp for our child processes, ShellExecuteW to open folders
# and links, Credential Manager for tokens.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
