      const d = splinters[i], p = reduceMotion ? 1 : easeOutExpo(clamp01((e - d.delay) / 1.4));
      if (p < 1) done = false;
      v.copy(d.to).multiplyScalar(p); v.y = d.to.y + d.hop * 4 * p * (1 - p) * (1 - p) + (1 - p) * 1.4;
      q.copy(d.q).multiply(sp.setFromAxisAngle(ax, (1 - p) * d.spin));
      inst.setMatrixAt(i, m4.compose(v, q, sc.setScalar(d.s)));
    }
    inst.instanceMatrix.needsUpdate = true;
    settled = done;
  }
  return { group, stones, splinterFrame, Lk, P };
}

// ---------- Status ----------
function statusTick(s, t, e) {
  const status = s.repo.status, Lk = look.Lk, calm = reduceMotion ? 0.6 : 0.5 + 0.5 * Math.sin(t * 1.57 + s.lay.phase);
  s.dim += ((isolate && isolate !== status ? 0.22 : 1) - s.dim) * 0.15;
  for (const u of [s.mat.uniforms, s.hidden?.material.uniforms]) {
    if (!u) continue;
    u.time.value = t;
    u.drift.value = status === 'working' && Lk.working === 'drift' && !reduceMotion ? 1 : 0;
    u.accentAmt.value = status === 'waiting' ? Lk.waitAmp[0] + Lk.waitAmp[1] * calm : 0;
    u.fade.value = s.dim;
  }
  if (s.underMat) {
    s.underMat.uniforms.fade.value = s.dim;
    if (status === 'working' && Lk.working === 'rosette' && !reduceMotion) s.underMat.uniforms.spin.value = t * 0.5;
  }
  for (const m of s.marks) {
    const u = m.material.uniforms;
    u.fade.value = s.dim; u.time.value = t; u.draw.value = reduceMotion ? 1 : clamp01((e - 1.3) / 0.6);
  }
}

// ---------- Light and dark ----------
const mq = matchMedia('(prefers-color-scheme: dark)');
function currentMode() {
  const t = document.documentElement.getAttribute('data-theme');
  return t === 'dark' || t === 'light' ? t : (mq.matches ? 'dark' : 'light');
}
const hex = (n) => '#' + n.toString(16).padStart(6, '0');
function setTokens() {
  const P = LOOKS[lookId].pal[mode], root = document.documentElement.style;
  const fg = new THREE.Color(P.ink), paper = new THREE.Color(P.paper);
  const rgba = (c, a) => { const s = c.clone().convertLinearToSRGB(); return `rgba(${Math.round(s.r * 255)}, ${Math.round(s.g * 255)}, ${Math.round(s.b * 255)}, ${a})`; };
  root.setProperty('--bg', hex(P.edge));
  root.setProperty('--panel', rgba(paper, 0.86));
  root.setProperty('--line', rgba(fg, 0.17));
  root.setProperty('--fg', hex(P.ink));
  root.setProperty('--muted', paper.clone().lerp(fg, 0.62).getStyle());
  root.setProperty('--on-fg', hex(P.paper));
  root.setProperty('--accent', hex(P.accent));
  root.setProperty('--mark', hex(P.accent));
  root.setProperty('color-scheme', mode);
  document.getElementById('mode').textContent = mode === 'dark' ? 'Light' : 'Dark';
}
function onModeChange() {
  const m = currentMode();
  if (m !== mode) { mode = m; setLook(lookId, true); }
}
mq.addEventListener('change', onModeChange);
new MutationObserver(onModeChange).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- Switching, camera, focus ----------
const pointer = { x: 0, y: 0, px: -1e4, py: -1e4, inside: false };
const aim = new THREE.Vector2();
const labelEl = document.getElementById('label');

function dispose(obj) {
  obj.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
}
function setLook(id, keepTime = false) {
  if (look) { scene.remove(look.group); dispose(look.group); }
  lookId = id;
  look = build(id, mode);
  scene.add(look.group);
  if (!keepTime) enterAt = clock.getElapsedTime();
  const Lk = LOOKS[id];
  document.getElementById('lookName').textContent = Lk.name;
  document.getElementById('pitch').textContent = Lk.pitch;
  document.getElementById('facts').innerHTML = Lk.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  document.getElementById('legend').innerHTML = STATUS_ORDER.map((s) =>
    `<li tabindex="0" data-status="${s}"><span class="sw ${s}"></span><span class="what">${STATUS_NAME[s]}</span><span class="how">${Lk.how[s]}</span></li>`).join('');
  for (const li of document.querySelectorAll('#legend li')) {
    const on = () => { isolate = li.dataset.status; }, off = () => { isolate = null; };
    li.addEventListener('mouseenter', on); li.addEventListener('mouseleave', off); li.addEventListener('focus', on); li.addEventListener('blur', off);
  }
  for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.look === id));
  setTokens();
  resize();
}

let camDist = 20;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  const vf = THREE.MathUtils.degToRad(camera.fov), hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  camDist = (LAYOUT_R + 0.4) / Math.sin(Math.min(vf * 1.25, hf) / 2) * 1.05;
  camera.updateProjectionMatrix();
  if (look) look.group.traverse((o) => { if (o.material?.uniforms?.px) o.material.uniforms.px.value = renderer.getPixelRatio(); });
}

const proj = new THREE.Vector3();
function pickFocus() {
  if (!pointer.inside) return null;
  let best = null, bestD = 130;
  for (const s of look.stones) {
    proj.copy(s.anchor).project(camera);
    s.sx = (proj.x * 0.5 + 0.5) * innerWidth; s.sy = (-proj.y * 0.5 + 0.5) * innerHeight;
    const d = Math.hypot(s.sx - pointer.px, s.sy - pointer.py);
    if (d < bestD) { bestD = d; best = s; }
  }
  return best;
}
function showLabel(s) {
  if (!s) { labelEl.classList.remove('on'); return; }
  const st = STONES[s.repo.lang] || STONES.C;
  labelEl.querySelector('.n').textContent = s.repo.name;
  labelEl.querySelector('.m').textContent = `${s.repo.host} · ${s.repo.lang} · ${st.stone}`;
  labelEl.querySelector('.s').innerHTML = `<span class="sw ${s.repo.status}"></span>${STATUS_TEXT[s.repo.status]}`;
  const w = labelEl.offsetWidth, h = labelEl.offsetHeight;
  let x = s.sx + 36, y = s.sy - h - 12;
  if (x + w > innerWidth - 12) x = s.sx - w - 36;
  x = Math.max(12, x); y = Math.max(12, Math.min(innerHeight - h - 12, y));
  labelEl.style.transform = `translate(${x}px, ${y}px)`;
  labelEl.classList.add('on');
}

function frame() {
  const t = clock.getElapsedTime(), e = t - enterAt;
  aim.x += (pointer.x - aim.x) * 0.05; aim.y += (pointer.y - aim.y) * 0.05;
  const el = THREE.MathUtils.degToRad(56 + aim.y * 4), az = aim.x * 0.12;
  camera.position.set(Math.sin(az) * Math.cos(el) * camDist, Math.sin(el) * camDist, Math.cos(az) * Math.cos(el) * camDist);
  camera.lookAt(0, 0, 0.3);
  look.splinterFrame(e);
  for (const s of look.stones) {
    const p = reduceMotion ? 1 : easeOutExpo(clamp01((e - s.lay.delay) / 1.5));
    const working = s.repo.status === 'working';
    s.holder.position.lerpVectors(s.start, s.final, p);
    s.holder.position.y = s.final.y + (1 - p) * s.start.y + s.focus * 0.3;
    s.holder.rotation.set(0, (1 - p) * s.spinIn, 0);
    s.holder.scale.setScalar((0.35 + 0.65 * p) * (1 + 0.06 * s.focus));
    if (!reduceMotion) s.mesh.rotation.y = s.lay.phase + t * (working ? 0.45 : 0.12) * s.lay.spinDir;
    s.anchor.copy(s.holder.position);
    statusTick(s, t, e);
  }
  const focused = pickFocus();
  for (const s of look.stones) s.focus += ((s === focused ? 1 : 0) - s.focus) * 0.15;
  showLabel(focused);
  composer.render();
  requestAnimationFrame(frame);
}

// ---------- Wiring ----------
addEventListener('resize', resize);
canvas.addEventListener('pointermove', (ev) => {
  pointer.px = ev.clientX; pointer.py = ev.clientY; pointer.inside = true;
  pointer.x = (ev.clientX / innerWidth) * 2 - 1; pointer.y = -((ev.clientY / innerHeight) * 2 - 1);
});
canvas.addEventListener('pointerdown', (ev) => { pointer.px = ev.clientX; pointer.py = ev.clientY; pointer.inside = true; });
canvas.addEventListener('pointerleave', () => { pointer.inside = false; pointer.x = 0; pointer.y = 0; });
for (const t of document.querySelectorAll('.tab')) t.addEventListener('click', () => setLook(t.dataset.look));
const toggleMode = () => document.documentElement.setAttribute('data-theme', mode === 'dark' ? 'light' : 'dark');
document.getElementById('mode').addEventListener('click', toggleMode);
document.getElementById('replay').addEventListener('click', () => setLook(lookId));
addEventListener('keydown', (ev) => {
  if (KEYS[ev.key]) setLook(KEYS[ev.key]);
  if (ev.key === 'd' || ev.key === 'D') toggleMode();
});

mode = currentMode();
setLook('banknote');
requestAnimationFrame(frame);
</script>
