name: Release

# Builds the Windows installer with the Linux helper bundled, which the app installs
# into WSL on first run. A `v*` tag also attaches the installer to a GitHub Release;
# a manual run only uploads it as a workflow artifact. The installer is unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A static musl build, so it runs on any distro whatever its glibc.
  helper:
    name: Linux helper (x86_64 musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      # The app reinstalls the helper unless `refract-agent --version` prints the
      # version of the app crate (HELPER_VERSION), so the app crate, the helper and
      # tauri.conf.json must all match (and match the tag).
      - name: Check versions
        run: |
          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          crate=$(cargo metadata --manifest-path app/src-tauri/Cargo.toml --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "refract") | .version')
          helper=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "refract-agent") | .version')
          echo "tauri.conf.json $conf, app crate $crate, helper $helper"
          test "$conf" = "$helper"
          test "$crate" = "$helper"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then test "${GITHUB_REF_NAME#v}" = "$helper"; fi
          echo "VERSION=$helper" >> "$GITHUB_ENV"
      - run: cargo build --release --locked -p refract-agent --target x86_64-unknown-linux-musl
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
      - name: Check the binary
        run: |
          bin=target/x86_64-unknown-linux-musl/release/refract-agent
          file "$bin"
          ls -l "$bin"
          test "$("$bin" --version)" = "refract-agent $VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: refract-agent
          path: target/x86_64-unknown-linux-musl/release/refract-agent
          if-no-files-found: error

  installer:
    name: Windows installer (NSIS)
    needs: helper
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            vscode-extension/package-lock.json
      # Where tauri.conf.json bundles it from.
      - uses: actions/download-artifact@v8
        with:
          name: refract-agent
          path: app/src-tauri/resources
      - name: Check the bundled helper
        run: test -s src-tauri/resources/refract-agent
      - run: npm ci
      # Packages the vsix; the helper is already in place, so it is left alone.
      - run: npm run resources
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: refract-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # Only this job can write to the repo, and it runs nothing from the build: it
  # attaches the installer the previous job uploaded.
  publish:
    name: GitHub Release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: refract-installer
          path: installer
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: installer/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
