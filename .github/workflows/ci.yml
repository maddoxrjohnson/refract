name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The helper and the shared crates (the root workspace; the app is excluded).
  rust-linux:
    name: Rust (Linux workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The interface: types, unit tests, the app build, and the web demo in a browser.
  web:
    name: Web (lint, Vitest, build, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: app/test-results/
          if-no-files-found: ignore

  # The VS Code extension that sets up the terminal-only window.
  extension:
    name: VS Code extension (typecheck, Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The Tauri app, built and tested natively on Windows.
  app-windows:
    name: Rust (Windows app)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            vscode-extension/package-lock.json
      - run: npm ci
      # tauri::generate_context! embeds ../dist, and tauri-build needs the bundled
      # resources: the vsix (packaged here) and the helper (an empty placeholder).
      - run: npm run build
      - run: npm run resources
      - run: cargo fmt --check
        working-directory: app/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri

  # Secrets anywhere in the history, not only in the pushed commits.
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    env:
      # The sha256 of the linux_x64 archive of that version; update both together.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: gitleaks git --redact --verbose --no-banner .
