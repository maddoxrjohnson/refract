[package]
name = "refract-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Refract's WSL helper: scans repos, reads Claude Code sessions and reports changes over stdio."

[dependencies]
refract-core = { path = "../refract-core" }
refract-launch = { path = "../refract-launch" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
inotify = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Edits agent.toml in place for addRepo, keeping comments; toml already depends on it.
toml_edit = { version = "0.22", default-features = false, features = ["parse", "display"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
