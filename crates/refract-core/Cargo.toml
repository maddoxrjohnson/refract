[package]
name = "refract-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Pure logic for Refract: transcript parsing, session state and resume preselection."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
